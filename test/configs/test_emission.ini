####################################################################################################
#                            plumeIR v3 — Configuration File                                      #
#       Variable name          Value               Description                                    #
####################################################################################################
#
# Emission geometry, 2019-09-11 dataset (Bruker, upward-looking, plume against cold sky).
#
# Geometry values are taken from v2's plumeIRconfig_emission.txt, which points at this exact
# dataset. Per the v2-provenance note, v2's *fit flags* are not a reliable record of what was run,
# but the *geometry* is site information and is trustworthy.
#
# max_opd and apod_type are read from the data files (see plumeIR.io.InstrumentILS) and are
# deliberately NOT set here.  This instrument: APF = 'NBM' (Norton-Beer medium) and
# max_opd = 1.037 cm, from 2L = POINTS/LWN = 1/(dnu*ZFF) = 2.074 cm.  The FOV is not in the
# file and stays below.

*DATA

data_dir            : data/2019-09-11              # Path to the directory containing spectral data files
filter_files        : True                         # Set to True to filter files by name string
filter_string       : plume                        # Only keep files whose name contains this string. None = keep all
filter_ext          : 0                            # Only keep files with this extension (e.g. 0, spc). None = all
max_spec            : 5                            # Maximum number of spectra to process


*MODEL

nperwn              : 25                           # Model spectral resolution [points per cm⁻¹] (0.04 cm⁻¹ sampling)
model_padding       : 50                           # Padding added to each side of the fit window for ILS convolution [cm⁻¹]
cache_dir           : None                         # Directory for caching pre-computed references. None = ~/.plumeIR/cache/


*GEOMETRY

type                : emission                     # Geometry type: layer | emission | solar

# Emission geometry parameters
plume_height        : 1.0                          # Height of the plume CENTRE above sea level [km] (layer spans height +/- thickness/2)
plume_thickness     : 0.4                          # Thickness of the plume layer [km]
elev                : 25                           # Viewing elevation angle [degrees from horizontal]
obs_height          : 0.2                          # Observer altitude above sea level [km]
atm_path            : mls.atm   		   # RFM-format atmosphere profile (mid-latitude summer, as v2)
sounding            : None                         # Radiosonde to merge into the profile. NOT YET CONSUMED

# Plume temperature. v2 DERIVED this from the atmosphere at plume_height
# (parameters.py:445); v3 takes it from config. 288.8 K is mls.atm at the plume
# mid-layer (1.2 km), i.e. the value v2 would have used. NOT v3's 350 K default.
plume_temp          : None                         # Plume gas temperature [K]. None = ambient from the profile at plume_height
#   plume_temp feeds BOTH the gas LUT query (absorption line strengths) and the
#   Planck self-emission term — Kirchhoff, for one thin near-isothermal layer.
#   An advected plume cools adiabatically to within a few K of ambient within
#   minutes, so ambient is the right a priori; mls.atm gives 289.70 K at 1.0 km.
fit_tplume          : False                        # Fit plume_temp as a free parameter — keep False
#   There is deliberately NO dt_plume offset. An offset that moved only the
#   emission level was exactly degenerate with the plume column: fitted, it
#   pinned at its +200 K bound in 3 of 5 spectra and SO2 collapsed to ~0.2.
#   Measured: fixing the plume temperature costs
#   2e-5 in R2 (0.99706 vs 0.99708) while taking SO2's correlation with the
#   measured SO2-band excess from 0.949 to 0.998. Fitting plume_temp DIRECTLY is
#   not exactly degenerate — it changes line shapes as well as the emission
#   level — but it stays off by default, bounded about ambient when enabled.
fit_tprox           : True                         # Fit the proximal layer temperature offset
dt_prox             : 0                            # A priori proximal temperature offset [K]
fit_tdist           : True                         # Fit the distal layer temperature offset
dt_dist             : 0                            # A priori distal temperature offset [K]
h2o_scaling         : 3                            # Number of atmospheric layers (0-3) sharing the H2O_sc parameter
subtract_self       : False                        # Inert in emission — instrument radiance is the calibration's L_inst
fit_difference      : False                        # MUST be False: difference mode is not wired through preprocessing
use_bbt             : False                        # Convert to brightness temperature before fitting
bb_drift            : True                         # Correct for blackbody reference drift over time
clear_drift         : True                         # Correct for clear-sky reference drift over time


*RETRIEVAL

retrieval_method    : nlls                         # Retrieval backend: nlls | oe
use_bounds          : True                         # Apply parameter bounds during optimisation
update_params       : False                        # Seed each fit with the result of the previous spectrum

# Aerosol treatment
fit_size_aero       : True                         # Fit aerosol effective radius as a free parameter
use_babs_aero       : True                         # Use absorption optical depth (Babs) for aerosol emission

# Instrument Line Shape
fit_fov             : True                         # Fit instrument field of view as a free parameter
fov                 : 0.030                        # A priori field of view [rad] = 30 mrad, this Bruker's nominal.
#   Unlike max_opd and apod_type, the FOV is NOT recorded in the file (Optik
#   has no APT field and CHN = 'External Input'), so it stays a config value.
#   Keep it FITTED: its variation is physical — stable to ~1% outside aerosol
#   episodes and rising with aerosol loading, where scattering widens the
#   effective field of view.
fit_max_opd         : False                        # Never fitted: degenerate with fov
#   max_opd is NOT set here: it is read from the data files.  1/RES is the
#   TOTAL double-sided path 2L, so the maximum OPD is half of it — this config
#   used to pin 2.0 cm against a true 1.037 cm, and a fitted fov absorbed the
#   error by running to 85 mrad against a 30 mrad nominal.  Setting max_opd
#   here would override the file; leave it unset unless you mean to.
#   apod_type likewise: the OPUS header's Fourier Transformation.APF = 'NBM'
#   maps to "NB medium", which happens to be what this config used to pin.  The
#   MIDAC was not so lucky — its files say 'triangle' against a pinned
#   "NB medium" — so read it from the file rather than relying on luck.
fit_shift           : True                         # Fit wavenumber shift as a free parameter
nu_shift            : 0                            # A priori wavenumber shift [cm⁻¹]
fit_offset          : False                        # Fit additive spectral offset as a free parameter
offset              : 0                            # A priori spectral offset

# Seeding from a prior run (all None = disabled)
force_param         : None                         # Force the value of a parameter from a prior run
seed_param          : None                         # Use a parameter value from a prior run as initial guess
df_dir              : None                         # Directory containing prior-run result files for seeding
use_residual        : False                        # Include a mean residual spectrum from a prior run in the model
res_dir             : None                         # Directory containing residual spectra from a prior run


*DEFAULTS

SO2_conc            : 2.0                          # SO2 prior concentration [ppmv]
SO2_max             : 5000.0                       # SO2 upper bound [ppmv]
H2SO4_size          : 1.0                          # H2SO4 aerosol prior effective radius [µm]
H2SO4_sigma         : 1.5                          # H2SO4 log-normal size distribution width
ASH_size            : 1.0                          # ASH aerosol prior effective radius [µm]
ASH_sigma           : 1.5                          # ASH log-normal size distribution width


# ------------------------
# FIT WINDOWS
# ------------------------

# The TIR window — the only one enabled in v2's emission config, and the band the
# emission retrieval targets (700-1300 cm-1).
*FIT0

fit                 : True                         # Include this window in the analysis
fit_window          : 750, 1250                    # Spectral fit window boundaries [cm⁻¹]: wn_start, wn_stop
atm_gases           : H2O, CO2, N2O, CH4, O3       # Atmospheric gas species to model in this window
plume_gases         : SO2                          # Plume gas species to model in this window
plume_aero          : H2SO4, ASH                   # Plume aerosol species to model in this window
targets             : SO2, H2SO4, ASH              # Species and parameters to report as primary outputs
polydeg             : 3                            # Degree of the multiplicative background polynomial
continuum           : H2O                          # Use the 2-D (T,VMR) continuum LUT — this is the TIR window where it matters
