####################################################################################################
#                            plumeIR v3 — Configuration File                                      #
#       Variable name          Value               Description                                    #
####################################################################################################

# Point to the data directory and specify file filtering
*DATA

data_dir            : /tmp/plumeIR_test_data    # Path to the directory containing spectral data files
filter_files        : True                       # Set to True to filter files by name string
filter_string       : plume                      # Only keep files whose name contains this string. None = keep all
filter_ext          : None                       # Only keep files with this extension (e.g. 0, spc). None = all
max_spec            : 500                        # Maximum number of spectra to process


# Forward model engine settings
# RFM and HITRAN paths are configured once via: python -m rfmwrapper configure
# The mieEODG ARIA database is always the bundled version — do not override.
*MODEL

nperwn              : 25                         # Model spectral resolution [points per cm⁻¹] (0.04 cm⁻¹ sampling)
model_padding       : 50                         # Padding added to each side of the fit window for ILS convolution [cm⁻¹]
cache_dir           : None                       # Directory for caching pre-computed references. None = ~/.plumeIR/cache/


# Measurement geometry and geometry-specific forward model flags
*GEOMETRY

type                : layer                      # Geometry type: layer | emission | solar

# Layer geometry parameters (ignored for emission and solar)
pathlength          : 1.22                       # Total geometric path length through plume and atmosphere [km]
atm_temp            : 284                        # Ambient atmospheric temperature [K]
atm_pres            : 973                        # Ambient atmospheric pressure [mbar]
plume_temp          : 450                        # Plume gas temperature [K]
plume_pres          : 973                        # Plume gas pressure [mbar]
plume_thickness     : 0.05                       # Thickness of the plume layer [km]

# Layer-specific forward model flags
fit_gas_temp        : False                      # Fit plume gas temperature as a free parameter
fit_atm_temp        : True                       # Fit atmospheric temperature as a free parameter
model_gas_emission  : False                      # Include thermal emission from hot plume gas in the forward model
fit_source_temp     : False                      # Fit background source temperature as a free parameter
source_temp         : 1500                       # A priori source temperature [K]
no_gas              : False                      # Isolate plume transmittance using a no-gas reference spectrum
subtract_self       : True                       # Subtract the instrument self-emission background before fitting
self_file           : None                       # Path to the self-emission spectrum. None = find '*self*' files in data_dir
use_source_e        : False                      # Include source emissivity in the forward model
e_file              : None                       # Path to source emissivity spectrum file. None = use default basalt


# Retrieval method and parameters passed to the forward model
*RETRIEVAL

retrieval_method    : nlls                       # Retrieval backend: nlls (Levenberg-Marquardt) | oe (Optimal Estimation)
use_bounds          : True                       # Apply parameter bounds during optimisation
update_params       : False                      # Seed each fit with the result of the previous spectrum

# Aerosol treatment
fit_size_aero       : True                       # Fit aerosol effective radius as a free parameter
use_babs_aero       : True                       # Use absorption optical depth (Babs) rather than extinction (Bext) for aerosols

# Instrument Line Shape
fit_fov             : True                       # Fit instrument field of view as a free parameter
fov                 : 0.021                      # A priori field of view [rad] = 21 mrad, MIDAC nominal.
#   Not recorded in the file, so it stays a config value.  Keep it FITTED: in
#   the layer geometry it is EXPECTED to move above and below nominal, because
#   the source itself is dynamic (varying fill fraction and temperature).
fit_max_opd         : False                      # Fit maximum optical path difference as a free parameter
#   max_opd is NOT set here: it is read from the data files.  This config used
#   to pin 1.8 cm against a true 1.037 cm (2L = POINTS/LWN = 2.074 cm), and a
#   fitted fov absorbed it by running to ~52 mrad against a 21 mrad nominal.
#   apod_type is NOT set here either, for the same reason and with a worse
#   history: this config pinned "NB medium" while the MIDAC's own files say
#   'triangle'.  Both are read from the SPC log block (Laser Wavenumber,
#   Zero Fill, POINTS, Apodization) — see io.spectrum.InstrumentILS.
#   Setting either key here overrides the file; do that only deliberately,
#   e.g. to reproduce an older run.

fit_shift           : True                       # Fit wavenumber shift as a free parameter
nu_shift            : 0                          # A priori wavenumber shift [cm⁻¹]
fit_offset          : False                      # Fit additive spectral offset as a free parameter
offset              : 0                          # A priori spectral offset

# Seeding from a prior run (all None = disabled)
force_param         : None                       # Force the value of a parameter from a prior run
seed_param          : None                       # Use a parameter value from a prior run as initial guess
df_dir              : None                       # Directory containing prior-run result files for seeding
use_residual        : False                      # Include a mean residual spectrum from a prior run in the model
res_dir             : None                       # Directory containing residual spectra from a prior run


# Per-species prior overrides — takes precedence over built-in defaults
#   Gas fields    : conc [ppmv], min, max, sigma_prior
#   Aerosol fields: conc, size [µm], sigma, min_size, max_size, comp, sigma_prior
#   Format        : SPECIES_field : value   (e.g. SO2_conc : 5.0)
*DEFAULTS

SO2_conc            : 2.0                        # SO2 prior concentration [ppmv]
SO2_max             : 5000.0                     # SO2 upper bound [ppmv]
H2SO4_size          : 1.0                        # H2SO4 aerosol prior effective radius [µm]
H2SO4_sigma         : 1.5                        # H2SO4 log-normal size distribution width


# ------------------------
# FIT WINDOWS
# ------------------------

# Fit window for SO2 (2.5 µm band)
*FIT0

fit                 : True                       # Include this window in the analysis
fit_window          : 2450, 2550                 # Spectral fit window boundaries [cm⁻¹]: wn_start, wn_stop
atm_gases           : H2O, N2O, CH4             # Atmospheric gas species to model in this window
plume_gases         : SO2                        # Plume gas species to model in this window
plume_aero          : None                       # Plume aerosol species to model in this window. None = no aerosols
targets             : SO2, gas_temp              # Species and parameters to report as primary outputs
polydeg             : 3                          # Degree of the multiplicative background polynomial
fit_gas_temp        : True                       # Per-window override: fit plume gas temperature. None = inherit from GEOMETRY


# Fit window for HCl (3.7 µm band)
*FIT1

fit                 : True                       # Include this window in the analysis
fit_window          : 2690, 2830                 # Spectral fit window boundaries [cm⁻¹]: wn_start, wn_stop
atm_gases           : H2O, N2O, CH4             # Atmospheric gas species to model in this window
plume_gases         : HCl                        # Plume gas species to model in this window
plume_aero          : None                       # Plume aerosol species to model in this window. None = no aerosols
targets             : HCl                        # Species and parameters to report as primary outputs
polydeg             : 3                          # Degree of the multiplicative background polynomial


# Fit window for SO2 + aerosols (8–13 µm band) — disabled
*FIT2

fit                 : False                      # Include this window in the analysis
fit_window          : 750, 1250                  # Spectral fit window boundaries [cm⁻¹]: wn_start, wn_stop
atm_gases           : H2O, CO2, N2O, CH4        # Atmospheric gas species to model in this window
plume_gases         : SO2                        # Plume gas species to model in this window
plume_aero          : H2SO4, ASH                 # Plume aerosol species to model in this window. None = no aerosols
targets             : SO2, H2SO4, ASH            # Species and parameters to report as primary outputs
polydeg             : 3                          # Degree of the multiplicative background polynomial
