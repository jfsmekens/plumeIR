# plumeIR config; every key is described in docs/CONFIG_REFERENCE.md

*DATA
data_dir             : ../data/2021-08-11
filter_files         : False
filter_ext           : spc

*MODEL
nperwn               : 25.0
model_padding        : 50.0
plume_temp_step      : 10.0
atm_temp_step        : 5.0

*GEOMETRY
type                 : layer
pathlength           : 2.0
atm_temp             : 284.0
atm_pres             : 973.0
plume_temp           : 450.0
plume_pres           : 973.0
plume_thickness      : 0.05
fit_plume_temp       : False
fit_atm_temp         : False
model_plume_emission : False
fit_source_temp      : False
source_temp          : 1500.0
no_gas               : False

*PREPROCESS
subtract_self        : True
self_file            : None
background           : report
reference_spectra    : 10
registration         : report

*RETRIEVAL
retrieval_method     : nlls
use_bounds           : True
update_params        : False
fit_r0               : True
use_babs_aero        : True
fit_fov              : True
fov                  : 0.021
fit_max_opd          : False
fit_shift            : True
shift                : 0.0
fit_offset           : False
offset               : 0.0

*DEFAULTS
so2_conc             : 2.0
so2_max              : 5000.0
h2so4_aq_size        : 1.0
water_size           : 1.0

*PLOT
ratios               : HCl:SO2, CO2:SO2, H2O:SO2, HF:SO2, H2SO4_aq:SO2
regression           : odr

*FIT0
fit                  : True
plume_aero           : None
polydeg              : 2
fit_window           : 2450.0, 2550.0
atm_gases            : H2O, N2O, CH4
plume_gases          : SO2
targets              : SO2, plume_temp
fit_plume_temp       : True

*FIT1
fit                  : True
plume_aero           : None
polydeg              : 2
fit_window           : 2690.0, 2830.0
atm_gases            : H2O, N2O, CH4
plume_gases          : HCl
targets              : HCl, atm_temp
plume_temp_from      : FIT0
fit_atm_temp         : True

*FIT2
fit                  : True
plume_aero           : H2SO4_aq, WATER
polydeg              : 2
fit_window           : 750.0, 1250.0
atm_gases            : H2O, CO2, CH4
plume_gases          : SO2
targets              : H2SO4_aq, WATER
plume_temp_from      : FIT0

*FIT3
fit                  : True
plume_aero           : None
polydeg              : 2
fit_window           : 2020.0, 2150.0
atm_gases            : H2O, CO2
plume_gases          : CO
targets              : CO, CO2, H2O
plume_temp_from      : FIT0

*FIT4
fit                  : True
plume_aero           : None
polydeg              : 2
fit_window           : 4020.0, 4060.0
atm_gases            : H2O
plume_gases          : HF
targets              : HF
plume_temp_from      : FIT0

*PATH
fit                  : True
plume_aero           : None
polydeg              : 2
fit_window           : 2880.0, 2990.0
atm_gases            : CH4, H2O, N2O
plume_gases          : HCl
tracer               : CH4
plume_temp_from      : FIT0
