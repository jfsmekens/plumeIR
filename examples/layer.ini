####################################################################################################
#                                 plumeIR v3 — Configuration File                                  #
#   Variable name             Value                              Description                       #
####################################################################################################


# Point to the data directory and specify file filtering
*DATA

data_dir             : ../data/2021-08-11       # Directory containing the spectral data files
filter_files         : False                    # Filter files by name with filter_string
filter_ext           : spc                      # Only keep files with this extension (e.g. 0, spc). None = all extensions


# Forward model engine settings (RFM and mieEODG)
*MODEL

nperwn               : 25.0                     # Model spectral sampling [points per cm⁻¹]
model_padding        : 50.0                     # Padding added to each side of the fit window for ILS convolution [cm⁻¹]


# Measurement geometry and geometry-specific forward model flags
*GEOMETRY

type                 : layer                    # Measurement geometry
pathlength           : 2.0                      # Total geometric path length through plume and atmosphere [km]  (layer only)
atm_temp             : 284.0                    # Ambient atmospheric temperature [K]  (layer only)
atm_pres             : 973.0                    # Ambient atmospheric pressure [mbar]  (layer only)
plume_temp           : 450.0                    # Plume gas temperature (a priori when fitted) [K]. None = ambient at plume_height, from the atmosphere profile (emission, solar)
plume_pres           : 973.0                    # Plume gas pressure [mbar]  (layer only)
plume_thickness      : 0.05                     # Thickness of the plume layer [km]. None = no plume (solar)
fit_gas_temp         : False                    # Fit the plume gas temperature (gas_temp)  (layer only)
fit_atm_temp         : False                    # Fit the atmospheric temperature (atm_temp)  (layer only)
model_gas_emission   : False                    # Model thermal emission from the hot plume gas (TIR windows only)  (layer only)
fit_source_temp      : False                    # Fit the background source temperature  (layer only)
source_temp          : 1500.0                   # A priori source temperature [K]  (layer only)
no_gas               : False                    # No-gas reference spectrum: not available in v3.0, must be False  (layer only)
path_tracer          : CH4                      # Well-mixed ambient gas whose fitted column checks pathlength (a diagnostic; it changes no fit). Must be an ambient-only, non-target gas of an active window. None = no path diagnostic  (layer only)


# What is done to the spectra before the fits (optional section)
*PREPROCESS

subtract_self        : True                     # Subtract the instrument self-emission spectrum before fitting  (layer and emission)
self_file            : None                     # Self-emission spectrum. None = find '*self*' files in the data directory  (layer only)
background           : report                   # Additive background from the opaque bands (self-emission scale and zero level): off, report (measured and written), or apply (subtracted instead of the self spectrum, unclipped)  (layer only)
reference_spectra    : 10                       # Number of first spectra whose median top hull is the reference for the relative scale and temperature (taken from the start of the series, so it also works in real time)  (layer only)
registration         : report                   # Wavenumber shift and scale by cross-correlation with a model spectrum: off, report (measured and written), or apply (the wavenumber axis corrected before the fits, per spectrum; nu_shift still fitted)  (layer and emission)


# Retrieval method and parameters passed to the forward model
#   sigma_prior_<param> : OE prior 1-sigma of any parameter by name (e.g. sigma_prior_fov); wins over a *DEFAULTS sigma_prior
*RETRIEVAL

retrieval_method     : nlls                     # Retrieval backend: nlls (non-linear least squares) or oe (optimal estimation)
use_bounds           : True                     # Apply parameter bounds during optimisation
update_params        : False                    # Seed each fit with the previous spectrum's result (serial runs only)
fit_size_aero        : True                     # Fit the aerosol effective radius (r0_SPECIES)
use_babs_aero        : True                     # Use the aerosol absorption (Babs) rather than extinction (Bext)
fit_fov              : True                     # Fit the instrument field of view
fov                  : 0.021                    # A priori field of view [rad]
fit_max_opd          : False                    # Fit the maximum optical path difference
fit_shift            : True                     # Fit the wavenumber shift
nu_shift             : 0.0                      # A priori wavenumber shift [cm⁻¹]
fit_offset           : False                    # Fit an additive spectral offset
offset               : 0.0                      # A priori spectral offset


# Per-species prior overrides, over the built-in tables in standards.py
#   Gas fields    : conc [ppmv], min, max, sigma_prior
#   Aerosol fields: conc [g m⁻³], size [µm], sigma, min_size [µm], max_size [µm], comp, sigma_prior
#   Format        : SPECIES_field : value   (e.g. SO2_conc : 5.0)
*DEFAULTS

so2_conc             : 2.0                      # Reference concentration: the column the scaling factor is relative to [ppmv]
so2_max              : 5000.0                   # Upper bound of the scaling factor (not for a 2-D continuum table). None = unbounded
h2so4_aq_size        : 1.0                      # A priori median radius r0 (clipped to the size bounds) [µm]


# Gas ratios and live plotting (optional section)
#   background_<gas> : Ambient VMR shown on ratio panels (layer) [ppmv]. None = standards.BACKGROUND_VMR (CO2 420, CO 0.1, CH4 1.9 ppmv)
*PLOT

ratios               : HCl:SO2, CO2:SO2, H2O:SO2, HF:SO2, H2SO4_aq:SO2 # Species ratios y:x, e.g. HCl:SO2, CO2:SO2 (targets of active windows). None = no ratios
regression           : odr                      # Ratio regression: Siegel repeated medians, Theil-Sen, or odr (York et al. 2004, weighted by both columns' fit errors)


# Fit window configuration (one *FIT0, *FIT1, ... section per window)
*FIT0

fit                  : True                     # Include this window in the analysis
plume_aero           : None                     # Plume aerosols. None = no aerosols
polydeg              : 2                        # Degree of the multiplicative background polynomial (polydeg + 1 coefficients; in v2 it was the coefficient count, so v2's 3 is v3's 2)
fit_window           : 2450.0, 2550.0           # Spectral fit window: wn_start, wn_stop [cm⁻¹]
atm_gases            : H2O, N2O, CH4            # Atmospheric gases. A gas also in plume_gases is fitted twice (layer only): ambient part GAS_atm over pathlength at atm_temp, plume part GAS. None = none
plume_gases          : SO2                      # Plume gases. A gas also in atm_gases keeps its name for the plume part (targets, ratios) and gets GAS_atm for the ambient part (layer only). None = none
targets              : SO2, gas_temp            # Species and parameters reported as primary outputs (a species in one window only). None = none
fit_gas_temp         : True                     # Per-window override: fit the plume gas temperature. None = inherit from *GEOMETRY  (layer only)


# Fit window configuration (one *FIT0, *FIT1, ... section per window)
*FIT1

fit                  : True                     # Include this window in the analysis
plume_aero           : None                     # Plume aerosols. None = no aerosols
polydeg              : 2                        # Degree of the multiplicative background polynomial (polydeg + 1 coefficients; in v2 it was the coefficient count, so v2's 3 is v3's 2)
fit_window           : 2690.0, 2830.0           # Spectral fit window: wn_start, wn_stop [cm⁻¹]
atm_gases            : H2O, N2O, CH4            # Atmospheric gases. A gas also in plume_gases is fitted twice (layer only): ambient part GAS_atm over pathlength at atm_temp, plume part GAS. None = none
plume_gases          : HCl                      # Plume gases. A gas also in atm_gases keeps its name for the plume part (targets, ratios) and gets GAS_atm for the ambient part (layer only). None = none
targets              : HCl, atm_temp            # Species and parameters reported as primary outputs (a species in one window only). None = none
plume_temp_from      : FIT0                     # Label of an earlier window fitting gas_temp (e.g. FIT0); its per-spectrum value is held fixed here. None = the window's own gas_temp  (layer only)
fit_atm_temp         : True                     # Per-window override: fit the atmospheric temperature. None = inherit from *GEOMETRY  (layer only)


# Fit window configuration (one *FIT0, *FIT1, ... section per window)
*FIT2

