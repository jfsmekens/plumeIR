####################################################################################################
#                                 plumeIR v3 — Configuration File                                  #
#   Variable name             Value                              Description                       #
####################################################################################################


# Point to the data directory and specify file filtering
*DATA

data_dir             : ../data/2019-09-11       # Directory containing the spectral data files
filter_files         : True                     # Filter files by name with filter_string
filter_string        : plume                    # Only keep files whose name contains this string. None = keep all
filter_ext           : 0                        # Only keep files with this extension (e.g. 0, spc). None = all extensions
max_spec             : 300                      # Maximum number of spectra to process (the earliest by acquisition time). None = all


# Forward model engine settings (RFM and mieEODG)
*MODEL

nperwn               : 25.0                     # Model spectral sampling [points per cm⁻¹]
model_padding        : 50.0                     # Padding added to each side of the fit window for ILS convolution [cm⁻¹]
cache_dir            : None                     # Directory for caching pre-computed references. None = ~/.plumeIR/cache/


# Measurement geometry and geometry-specific forward model flags
*GEOMETRY

type                 : emission                 # Measurement geometry
plume_height         : 1.0                      # Height of the plume centre above sea level [km]. None = no plume (solar)  (emission and solar)
plume_thickness      : 0.4                      # Thickness of the plume layer [km]. None = no plume (solar)
elev                 : 25.0                     # Elevation angle of the line of sight above the horizon [degrees]  (emission and solar)
obs_height           : 0.2                      # Observer altitude above sea level [km]  (emission and solar)
atm_path             : mls.atm                  # RFM-format atmosphere profile (a bare name is also looked for in RFM's atm directory)  (emission and solar)
plume_temp           : None                     # Plume gas temperature (a priori when fitted) [K]. None = ambient at plume_height, from the atmosphere profile (emission, solar)
fit_tplume           : False                    # Fit the plume temperature (needs an explicit plume_temp)  (emission only)
fit_tprox            : True                     # Fit the proximal layer temperature offset  (emission only)
dt_prox              : 0.0                      # A priori proximal layer temperature offset [K]  (emission only)
fit_tdist            : True                     # Fit the distal layer temperature offset  (emission only)
dt_dist              : 0.0                      # A priori distal layer temperature offset [K]  (emission only)
h2o_scaling          : 3                        # Number of atmospheric layers the shared H2O_sc parameter scales (0 disables it)  (emission only)
fit_difference       : False                    # Fit plume minus clear sky (not supported in v3.0)  (emission only)
use_bbt              : False                    # Convert spectra to brightness temperature before fitting  (emission only)
bb_drift             : True                     # Correct for blackbody reference drift over time  (emission only)
clear_drift          : True                     # Correct for clear-sky reference drift over time  (emission only)
model_aero_scattering : False                   # Add the aerosol single-scattering source term to the plume  (emission only)


# What is done to the spectra before the fits (optional section)
*PREPROCESS

subtract_self        : False                    # Subtract the instrument self-emission spectrum before fitting  (layer and emission)
registration         : report                   # Wavenumber shift and scale by cross-correlation with a model spectrum: off, report (measured and written), or apply (the wavenumber axis corrected before the fits, per spectrum; nu_shift still fitted)  (layer and emission)


# Retrieval method and parameters passed to the forward model
#   sigma_prior_<param> : OE prior 1-sigma of any parameter by name (e.g. sigma_prior_fov); wins over a *DEFAULTS sigma_prior
*RETRIEVAL

retrieval_method     : nlls                     # Retrieval backend: nlls (non-linear least squares) or oe (optimal estimation)
use_bounds           : True                     # Apply parameter bounds during optimisation
update_params        : False                    # Seed each fit with the previous spectrum's result (serial runs only)
fit_size_aero        : True                     # Fit the aerosol effective radius (r0_SPECIES)
use_babs_aero        : True                     # Use the aerosol absorption (Babs) rather than extinction (Bext)
fit_fov              : True                     # Fit the instrument field of view
fov                  : 0.03                     # A priori field of view [rad]
fit_max_opd          : False                    # Fit the maximum optical path difference
fit_shift            : True                     # Fit the wavenumber shift
nu_shift             : 0.0                      # A priori wavenumber shift [cm⁻¹]
fit_offset           : False                    # Fit an additive spectral offset
offset               : 0.0                      # A priori spectral offset


# Per-species prior overrides, over the built-in tables in standards.py
#   Gas fields    : conc [ppmv], min, max, sigma_prior
#   Aerosol fields: conc [g m⁻³], size [µm], sigma, min_size [µm], max_size [µm], comp, sigma_prior
#   Format        : SPECIES_field : value   (e.g. SO2_conc : 5.0)
*DEFAULTS

so2_conc             : 2.0                      # Reference concentration: the column the scaling factor is relative to [ppmv]
so2_max              : 5000.0                   # Upper bound of the scaling factor (not for a 2-D continuum table). None = unbounded
h2so4_aq_size        : 1.0                      # A priori median radius r0 (clipped to the size bounds) [µm]
ash_size             : 1.0                      # A priori median radius r0 (clipped to the size bounds) [µm]


# Gas ratios and live plotting (optional section)
#   background_<gas> : Ambient VMR shown on ratio panels (layer) [ppmv]. None = standards.BACKGROUND_VMR (CO2 420, CO 0.1, CH4 1.9 ppmv)
*PLOT

ratios               : H2SO4_aq:SO2, ASH:SO2       # Species ratios y:x, e.g. HCl:SO2, CO2:SO2 (targets of active windows). None = no ratios


# Fit window configuration (one *FIT0, *FIT1, ... section per window)
*FIT0

fit                  : True                     # Include this window in the analysis
fit_window           : 750.0, 1250.0            # Spectral fit window: wn_start, wn_stop [cm⁻¹]
atm_gases            : H2O, CO2, N2O, CH4, O3   # Atmospheric gases. A gas also in plume_gases is fitted twice (layer only): ambient part GAS_atm over pathlength at atm_temp, plume part GAS. None = none
plume_gases          : SO2                      # Plume gases. A gas also in atm_gases keeps its name for the plume part (targets, ratios) and gets GAS_atm for the ambient part (layer only). None = none
plume_aero           : H2SO4_aq, ASH               # Plume aerosols. None = no aerosols
targets              : SO2, H2SO4_aq, ASH          # Species and parameters reported as primary outputs (a species in one window only). None = none
polydeg              : 3                        # Degree of the multiplicative background polynomial (polydeg + 1 coefficients; in v2 it was the coefficient count, so v2's 3 is v3's 2)
continuum            : H2O                      # Gases whose continuum follows VMR on a 2-D (T, VMR) table (e.g. H2O). Every table includes RFM's continuum. For a gas in both roles, the ambient part only. None = continuum scaled linearly with the column
