# plumeIR config; every key is described in docs/CONFIG_REFERENCE.md

*DATA
data_dir             : ../data/2019-09-11
filter_files         : True
filter_string        : plume
filter_ext           : 0
max_spec             : 300

*MODEL
nperwn               : 25.0
model_padding        : 50.0
plume_temp_step      : 10.0
atm_temp_step        : 5.0
cache_dir            : None

*GEOMETRY
type                 : emission
plume_height         : 1.0
plume_thickness      : 0.4
elev                 : 25.0
obs_height           : 0.2
atm_path             : mls.atm
plume_temp           : None
fit_plume_temp       : False
fit_dt_prox          : True
dt_prox              : 0.0
fit_dt_dist          : True
dt_dist              : 0.0
h2o_scaling          : 3
fit_difference       : False
use_bbt              : False
bb_drift             : True
clear_drift          : True
model_aero_scattering : False

*PREPROCESS
subtract_self        : False
registration         : report

*RETRIEVAL
retrieval_method     : nlls
use_bounds           : True
update_params        : False
fit_r0               : True
use_babs_aero        : True
fit_fov              : True
fov                  : 0.03
fit_max_opd          : False
fit_shift            : True
shift                : 0.0
fit_offset           : False
offset               : 0.0

*DEFAULTS
so2_conc             : 2.0
so2_max              : 5000.0
h2so4_aq_size        : 1.0
ash_size             : 1.0

*PLOT
ratios               : H2SO4_aq:SO2, ASH:SO2

*FIT0
fit                  : True
fit_window           : 750.0, 1250.0
atm_gases            : H2O, CO2, N2O, CH4, O3
plume_gases          : SO2
plume_aero           : H2SO4_aq, ASH
targets              : SO2, H2SO4_aq, ASH
polydeg              : 3
continuum            : H2O
