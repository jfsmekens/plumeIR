[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plumeIR"
version = "3.0.0rc3"
description = "Retrieval of volcanic and atmospheric gases and aerosols from open-path FTIR spectra"
readme = "README.md"
license = { text = "MIT" }
# mieEODG requires 3.11.
requires-python = ">=3.11"
authors = [{ name = "J.-F. Smekens", email = "js4247@nau.edu" }]
keywords = ["FTIR", "OP-FTIR", "volcanic gas", "retrieval", "radiative transfer", "spectroscopy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    # Companion packages, not on PyPI: install them from GitHub first (README,
    # "Installation").  Minimum versions only, so fixes reach users without a
    # plumeIR release (decided 2026-11-13); each run records the installed
    # versions and commits in summary.txt (plumeIR/provenance.py).
    #
    # rfmwrapper >= 0.6.0: insertPlume's peak-normalised gradient_flag=2 and
    # guard levels, used to validate the emission layer model.
    "rfmwrapper>=0.6.0",
    # [lut] pulls xarray + netCDF4.  Without them mieEODG's LUT persistence
    # fails silently (one warning line) and the H2SO4 Mie grid is rebuilt on
    # every run (~36 min) instead of once.
    "mieEODG[lut]>=0.3.0",
    # Core numerics
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    # Retrieval backends
    "pyOptimalEstimation>=0.5",
    # Plotting
    "matplotlib>=3.7",
    "cmcrameri>=1.7",
    # Utilities
    "tqdm>=4.60",
    # MIDAC .spc files are read by plumeIR.spectra.spc (no dependency; the
    # pyspectra/spc-spectra pair was dropped 2026-11-13).
]

[project.optional-dependencies]
bruker = ["brukeropusreader>=1.0"]  # Bruker OPUS files (lazy-imported in spectra.read_bruker)
test = ["pytest>=7.0"]

[project.scripts]
plumeIR = "plumeIR.__main__:main"

[project.urls]
Repository = "https://github.com/jfsmekens/plumeIR"

[tool.setuptools.packages.find]
where = ["."]
include = ["plumeIR*"]
